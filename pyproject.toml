[project]
name = "goose-plotter"
version = "0.6.0"
description = "GOOSE, the Graphical Oscillation Observation Software Environment: a vibe coded tool for creating Condensed Matter Physics plots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Quarry", email = "52108977+Quarrinexus@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
]

[project.scripts]
goose-plotter = "goose_plotter:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
